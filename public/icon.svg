<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#292524" />
      <stop offset="100%" stop-color="#0c0a09" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="104" fill="url(#bgGlow)" />
  <rect width="504" height="504" x="4" y="4" rx="100" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.3" />
  
  <!-- Outer decorative ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="8 6" stroke-opacity="0.4" />
  
  <!-- FUZE emblem: Stylized F with hop and flame -->
  <g transform="translate(140, 120)">
    <!-- Brewery hop / flame backdrop -->
    <path d="M116 20 C180 60, 200 140, 160 210 C120 280, 40 270, 20 220 C0 170, 40 80, 116 20 Z" fill="url(#flameGrad)" opacity="0.15" />
    
    <!-- Letter F bold typography -->
    <path d="M30 20 L190 20 L190 65 L85 65 L85 115 L170 115 L170 160 L85 160 L85 260 L30 260 Z" fill="url(#goldGrad)" />
  </g>
  
  <text x="256" y="420" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="34" fill="#fbbf24" letter-spacing="8" text-anchor="middle">FUZE</text>
  <text x="256" y="450" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="16" fill="#a8a29e" letter-spacing="4" text-anchor="middle">GASTRO AKADEMIE</text>
</svg>
